server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 法規 PDF 動輒數 MB，而 nginx 預設只允許 1 MB。
    # 不設這個的話，從前端上傳會被 nginx 擋在門口回 413，
    # 後端連請求都收不到——看起來像後端壞了，其實是代理擋的。
    client_max_body_size 100m;

    # SPA routing - fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # 容器名稱是 law-backend，與 law-qdrant、law-seaweedfs 同一套命名。
        # 先前寫的是 backend:8000，那個名稱不存在、解析不到。
        proxy_pass http://law-backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # KV 預熱是同步端點，327 個片段要跑一分鐘上下；冷快取時更久。
        # nginx 預設 60 秒會先切斷連線，使用者看到的是 504 而非結果。
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # API 文件。後端的 Swagger UI 掛在 /swagger/，這裡把 /docs 導過去，
    # 讓網址好記一點。
    #
    # 用轉址而非重寫路徑：Swagger UI 頁面內部以相對路徑載入自己的 JS/CSS
    # 與 swagger.json，把 /docs/ 改寫成 /swagger/ 的話那些附屬請求會找不到。
    #
    # ⚠ 後端只在 ASPNETCORE_ENVIRONMENT=Development 時啟用 Swagger，
    # 改成 Production 之後這個路徑會變成 404。
    location = /docs {
        return 302 /swagger/;
    }

    location /swagger {
        proxy_pass http://law-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        access_log off;
        return 200 '{"status": "Healthy"}';
        add_header Content-Type application/json;
    }
}
