server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 法規 PDF 動輒數 MB，而 nginx 預設只允許 1 MB。
    # 不設這個的話，從前端上傳會被 nginx 擋在門口回 413，
    # 後端連請求都收不到——看起來像後端壞了，其實是代理擋的。
    client_max_body_size 100m;

    # SPA routing - fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ⚠ 後端的位址必須在「每次請求」時解析，不能在 nginx 啟動時解析一次。
    #   proxy_pass 直接寫主機名稱的話，nginx 只在啟動時查一次 DNS 並記住 IP。
    #   後端容器重啟後可能拿到不同的 IP，而舊 IP 會被別的容器接手——
    #   2026/10/05 壓測時就是如此，/api 的請求被送到了 vLLM，
    #   得到的是它回的 404，看起來像「後端的路由消失了」。
    #   改用變數強制 nginx 每次查，快取 5 秒。
    #
    # 這個檔案是範本，不是最終設定：官方 nginx 映像啟動時會把
    # /etc/nginx/templates/*.template 內的 ${變數} 以環境變數代換後寫成設定檔。
    # 只有下面兩個變數會被代換，nginx 自己的 $host、$uri 等不受影響。
    #
    #   NGINX_LOCAL_RESOLVERS  由映像依 /etc/resolv.conf 自動填入
    #                          （需設 NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1，Dockerfile 已設）。
    #                          Docker 下是 127.0.0.11，k8s 下是叢集 DNS，兩邊都不用手動指定。
    #   BACKEND_URL            後端的位址。預設 http://law-backend:8000（compose 的容器名稱），
    #                          k8s 下由 chart 設成 Service 名稱。
    resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;

    location /api/ {
        set $law_backend ${BACKEND_URL};
        # 容器名稱是 law-backend，與 law-qdrant、law-seaweedfs 同一套命名。
        # 先前寫的是 backend:8000，那個名稱不存在、解析不到。
        proxy_pass $law_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # KV 預熱是同步端點，327 個片段要跑一分鐘上下；冷快取時更久。
        # nginx 預設 60 秒會先切斷連線，使用者看到的是 504 而非結果。
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # API 文件。後端的 Swagger UI 掛在 /swagger/，這裡把 /docs 導過去，
    # 讓網址好記一點。
    #
    # 用轉址而非重寫路徑：Swagger UI 頁面內部以相對路徑載入自己的 JS/CSS
    # 與 swagger.json，把 /docs/ 改寫成 /swagger/ 的話那些附屬請求會找不到。
    #
    # ⚠ 後端只在 ASPNETCORE_ENVIRONMENT=Development 時啟用 Swagger，
    # 改成 Production 之後這個路徑會變成 404。
    location = /docs {
        return 302 /swagger/;
    }

    location /swagger {
        set $law_backend ${BACKEND_URL};
        proxy_pass $law_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        access_log off;
        return 200 '{"status": "Healthy"}';
        add_header Content-Type application/json;
    }
}
