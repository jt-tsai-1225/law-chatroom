{{- if not .Values.secrets.existingSecret }}
{{- /*
  required：任何一個沒給就當場失敗。預設密碼比沒有密碼更糟——
  它看起來有保護，實際上任何讀過 repo 的人都知道。
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "law-app.secretName" . }}
  labels:
    {{- include "law-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "請用 --set secrets.postgresPassword=... 提供，或用 secrets.existingSecret 指定既有的 Secret" .Values.secrets.postgresPassword | quote }}
  EMBEDDING_API_KEY: {{ required "請用 --set secrets.embeddingApiKey=... 提供" .Values.secrets.embeddingApiKey | quote }}
  S3_SECRET_KEY: {{ required "請用 --set secrets.s3SecretKey=... 提供" .Values.secrets.s3SecretKey | quote }}
{{- end }}
