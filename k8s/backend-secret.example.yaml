# 範例檔案 - 請複製一份改名為 backend-secret.yaml，填入真實金鑰後再 kubectl apply。
# backend-secret.yaml 已在 .gitignore 中排除，避免真實金鑰被提交到版控。
#
# 也可以不用這個檔案，直接用指令建立：
#   kubectl create secret generic chatbot-backend-secret \
#     --from-literal=RAGSettings__EmbeddingApiKey=<your-embedding-api-key> \
#     --from-literal=RAGSettings__LlmApiKey=<your-llm-api-key>
apiVersion: v1
kind: Secret
metadata:
  name: chatbot-backend-secret
type: Opaque
stringData:
  RAGSettings__EmbeddingApiKey: "REPLACE_ME"
  RAGSettings__LlmApiKey: "REPLACE_ME"
