apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatbot-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: chatbot.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: chatbot-backend-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chatbot-frontend-service
            port:
              number: 80
