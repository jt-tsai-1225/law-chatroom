apiVersion: v1
kind: ConfigMap
metadata:
  name: chatbot-backend-config
data:
  RAGSettings__QdrantHost: "qdrant"
  RAGSettings__QdrantPort: "6333"
  RAGSettings__QdrantGrpcPort: "6334"
  RAGSettings__EmbeddingEndpoint: "https://ainexus.phison.com/api/external/v1/embeddings"
  RAGSettings__EmbeddingModel: "Qwen/Qwen3-Embedding-0.6B"
  RAGSettings__LlmEndpoint: "https://ainexus.phison.com/api/external/v1/chat/completions"
  RAGSettings__LlmModel: "Qwen/Qwen3.6-35B-A3B-FP8"
---
# 注意：chatbot-backend-secret 這個 Secret 不在這個檔案裡（避免把佔位值誤套用、
# 或反過來覆蓋掉你已經建立的真實金鑰）。部署前請先用以下指令建立：
#   kubectl create secret generic chatbot-backend-secret \
#     --from-literal=RAGSettings__EmbeddingApiKey=<your-embedding-api-key> \
#     --from-literal=RAGSettings__LlmApiKey=<your-llm-api-key>
# 或參考 k8s/backend-secret.example.yaml。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-backend
  labels:
    app: chatbot-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chatbot-backend
  template:
    metadata:
      labels:
        app: chatbot-backend
    spec:
      containers:
      - name: backend
        image: chatbot-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: chatbot-backend-config
        - secretRef:
            name: chatbot-backend-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/chat/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/chat/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-backend-service
spec:
  selector:
    app: chatbot-backend
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
