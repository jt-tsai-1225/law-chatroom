services:
  backend:
    build:
      context: ./backend/ChatBot.Api
      dockerfile: Dockerfile
    image: chatbot-backend:latest
    container_name: chatbot-backend
    ports:
      - "8000:8000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8000
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_GRPC_PORT=6334
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-your-api-key-here}
      - EMBEDDING_MODEL=text-embedding-ada-002
    depends_on:
      qdrant:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: chatbot-frontend:latest
    container_name: chatbot-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    container_name: chatbot-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # 不可掛 ./qdrant_storage —— 那會把資料庫檔案寫進 git 儲存庫裡，
      # 造成 git status 永遠是髒的，而且 git pull / checkout 會在資料庫
      # 運行中改寫檔案導致損毀。改用 docker 管理的具名 volume。
      # 要指定主機路徑時，設環境變數 QDRANT_STORAGE 並改成 bind mount。
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
