services:
  backend:
    build:
      context: ./backend/ChatBot.Api
      dockerfile: Dockerfile
    image: chatbot-backend:latest
    container_name: chatbot-backend
    ports:
      - "8000:8000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8000
      # 注意：要覆寫 appsettings.json 裡巢狀的 RAGSettings 設定，
      # 環境變數必須用雙底線 (RAGSettings__X) 表示巢狀路徑，扁平的 EMBEDDING_API_KEY 等名稱不會被綁定。
      - RAGSettings__QdrantHost=qdrant
      - RAGSettings__QdrantPort=6333
      - RAGSettings__QdrantGrpcPort=6334
      - RAGSettings__EmbeddingApiKey=${EMBEDDING_API_KEY:-}
      - RAGSettings__EmbeddingEndpoint=${EMBEDDING_ENDPOINT:-https://ainexus.phison.com/api/external/v1/embeddings}
      - RAGSettings__EmbeddingModel=${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - RAGSettings__LlmApiKey=${LLM_API_KEY:-}
      - RAGSettings__LlmEndpoint=${LLM_ENDPOINT:-https://ainexus.phison.com/api/external/v1/chat/completions}
      - RAGSettings__LlmModel=${LLM_MODEL:-Qwen/Qwen3.6-35B-A3B-FP8}
    depends_on:
      qdrant:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: chatbot-frontend:latest
    container_name: chatbot-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    container_name: chatbot-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
